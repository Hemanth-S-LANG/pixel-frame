version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

# Notes:
# - MongoDB is external (Atlas) — connection string in ./backend/.env as MONGODB_URI
# - Frontend is deployed on Vercel — not part of this Docker setup
# Run: docker compose up --build
